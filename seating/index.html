    text-transform: uppercase;
    color: rgba(245,240,232,.55);

  .field { position: relative; display: flex; align-items: center; }

  .field input {

    font-size: 1.3rem;
    color: var(--ivory);
    padding: 1rem 3rem 1rem 1.15rem;

    border: 1px solid rgba(201,168,76,.28);

  .field input::placeholder { color: rgba(245,240,232,.4); font-style: italic; }
  .field input:hover { border-color: rgba(201,168,76,.5); }
  .field input:focus { outline: none; border-color: var(--gold); background: rgba(245,240,232,.07); }
  .field input:focus-visible { outline: 2px solid var(--gold-light); outline-offset: 3px; }

  .clear {
    position: absolute;
    right: .45rem;
    width: 2.4rem; height: 2.4rem;
    display: grid; place-items: center;
    border: 0; background: transparent;
    color: rgba(245,240,232,.5);

    cursor: pointer;
    font-family: inherit;

  .clear:focus-visible { outline: 2px solid var(--gold-light); outline-offset: 1px; border-radius: 50%; }
  .clear[hidden] { display: none; }

  /* ── results ── */

  .result { display: flex; flex-direction: column; gap: .5rem; }

  .card {
    border: 1px solid rgba(201,168,76,.22);
    background: linear-gradient(180deg, rgba(26,42,94,.28), rgba(13,22,53,.18));

/* ───────────────────────── lookup engine ───────────────────────── */

const MAX_CHOICES = 8;

const norm = s => s
  .toLowerCase()
  .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
  .replace(/[^a-z0-9]+/g, " ")
  .trim();

const INDEX = GUESTS.map(g => ({ ...g, tokens: norm(g.name).split(" ").filter(Boolean) }))
  .sort((a, b) => {
    const la = a.tokens[a.tokens.length - 1], lb = b.tokens[b.tokens.length - 1];
    return la === lb ? a.tokens[0].localeCompare(b.tokens[0]) : la.localeCompare(lb);
  });

/* one typo away? — substitution, insertion, deletion, or a swapped pair
   (transpositions are how names actually get mistyped on a phone) */
function near(a, b) {
  if (a === b) return true;
  if (Math.abs(a.length - b.length) > 1) return false;

  let i = 0;
  while (i < a.length && i < b.length && a[i] === b[i]) i++;

  if (a.length === b.length) {
    if (a.slice(i + 1) === b.slice(i + 1)) return true;                    // substitution
    return a[i] === b[i + 1] && a[i + 1] === b[i]                          // swapped pair
        && a.slice(i + 2) === b.slice(i + 2);
  }
  return a.length > b.length
    ? a.slice(i + 1) === b.slice(i)                                        // extra letter typed
    : a.slice(i) === b.slice(i + 1);                                       // letter missed
}

/* every query word must claim a different word of the name, by prefix */
function matches(guest, qTokens, fuzzy) {
  const claimed = new Set();
  for (const qt of qTokens) {
    let hit = -1;
    for (let i = 0; i < guest.tokens.length; i++) {
      if (!claimed.has(i) && guest.tokens[i].startsWith(qt)) { hit = i; break; }
    }
    if (hit < 0 && fuzzy && qt.length >= 3) {
      for (let i = 0; i < guest.tokens.length; i++) {
        if (claimed.has(i)) continue;
        const gt = guest.tokens[i];
        if (near(qt, gt.slice(0, qt.length)) || near(qt, gt.slice(0, qt.length + 1))) { hit = i; break; }
      }
    }
    if (hit < 0) return false;
    claimed.add(hit);
  }
  return true;
}

function search(query) {
  const qTokens = norm(query).split(" ").filter(Boolean);
  if (!qTokens.length) return { qTokens, found: [], fuzzy: false };
  let found = INDEX.filter(g => matches(g, qTokens, false));
  let fuzzy = false;
  if (!found.length) {
    found = INDEX.filter(g => matches(g, qTokens, true));
    fuzzy = found.length > 0;
  }
  return { qTokens, found, fuzzy };
}

/* ───────────────────────── rendering ───────────────────────── */

const input  = document.getElementById("q");
const clear  = document.getElementById("clear");
const result = document.getElementById("result");

const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
};

function seatCard(people, fuzzy) {
  const table = people[0].table;
  const isNumbered = typeof table === "number";
  const card = el("div", "card");

  card.append(el("p", "who", people.length === 1 ? people[0].name : "Your party"));
  card.append(el("p", "label", isNumbered ? "is seated at table" : "is seated at"));

  const seat = el("p", "seat", String(table));
  if (!isNumbered) seat.classList.add("is-words");
  card.append(seat);

  if (people.length === 1 && people[0].note) card.append(el("p", "note", people[0].note));

  if (people.length > 1) {
    const list = el("ul", "party");
    people.forEach(p => list.append(el("li", null, p.name)));
    card.append(list);
  }

  if (fuzzy) card.append(el("p", "note", "Matched on a close spelling — if that isn’t you, keep typing."));
  return card;
}

function render() {
  clear.hidden = input.value.length === 0;
  result.replaceChildren();

  const { qTokens, found, fuzzy } = search(input.value);
  if (!qTokens.length) return;

  const typed = qTokens.join("").length;

  if (!found.length) {
    result.append(el("p", "status", "No match yet. Try your surname, or the name printed on your invitation."));
    return;
  }

  /* one answer — or several people who all share a table */
  const oneTable = found.every(g => String(g.table) === String(found[0].table));
  if (typed >= 2 && (found.length === 1 || (oneTable && found.length <= 6))) {
    result.append(seatCard(found, fuzzy));
    return;
  }

  if (found.length > MAX_CHOICES) {
    result.append(el("p", "status", found.length + " people match so far — keep typing."));
    return;
  }

  const list = el("ul", "choices");
  found.forEach(g => {
    const li = el("li");
    const btn = el("button");
    btn.type = "button";
    btn.append(el("span", "nm", g.name));
    btn.append(el("span", "tb", typeof g.table === "number" ? "Table " + g.table : g.table));
    btn.addEventListener("click", () => { input.value = g.name; render(); input.blur(); });
    li.append(btn);
    list.append(li);
  });
  result.append(el("p", "status", "Which one are you?"));
  result.append(list);
}

input.addEventListener("input", render);
clear.addEventListener("click", () => { input.value = ""; render(); input.focus(); });
input.addEventListener("keydown", e => { if (e.key === "Escape") { input.value = ""; render(); } });

if (!matchMedia("(pointer: coarse)").matches) input.focus();
render();

/* ───────────────────────── starfield ───────────────────────── */

(() => {
  const canvas = document.getElementById("stars");
  const ctx = canvas.getContext("2d");
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let stars = [], raf;

  function seed() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width  = innerWidth  * dpr;
    canvas.height = innerHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const count = Math.round(innerWidth * innerHeight / 9000);
    stars = Array.from({ length: count }, () => ({
      x: Math.random() * innerWidth,
      y: Math.random() * innerHeight,
      r: Math.random() * 1.1 + .3,
      a: Math.random() * .5 + .2,
      s: Math.random() * .015 + .004,
      p: Math.random() * Math.PI * 2,
    }));
  }

  function draw() {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    for (const st of stars) {
      st.p += st.s;
      const alpha = still ? st.a : st.a + Math.sin(st.p) * .18;
      ctx.beginPath();
      ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(245,240,232," + Math.max(0, alpha).toFixed(3) + ")";
      ctx.fill();
    }
    if (!still) raf = requestAnimationFrame(draw);
  }

  addEventListener("resize", () => { seed(); if (still) draw(); });
  seed();
  draw();
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) cancelAnimationFrame(raf);
    else if (!still) raf = requestAnimationFrame(draw);
  });
})();
</script>
</body>
</html>
